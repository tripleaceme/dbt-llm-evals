name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          package-name: dbt-llm-evals

      # If a release was created, update version in dbt_project.yml
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main

      - name: Update dbt_project.yml version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          sed -i "s/^version: .*/version: '${VERSION}'/" dbt_project.yml
          echo "Updated dbt_project.yml to version ${VERSION}"

      - name: Commit version bump
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dbt_project.yml
          git diff --staged --quiet || git commit -m "chore: bump dbt_project.yml version to ${{ steps.release.outputs.tag_name }}"
          git push
